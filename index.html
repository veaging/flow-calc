<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>流量快速運算</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 15px; background-color: #f4f4f9; color: #333; }
        h2 { text-align: center; color: #2c3e50; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        .result-box { background: #e8f4fd; padding: 10px; border-radius: 5px; margin-top: 10px; font-weight: bold; color: #007bff; }
        
        /* 直式運算專用樣式 */
        .vertical-calc { 
            font-family: monospace; 
            font-size: 14px; 
            color: #333; 
            background-color: #f8f9fa; 
            border-left: 3px solid #007bff; 
            border-radius: 5px; 
            padding: 10px; 
            margin-top: 8px; 
            display: inline-block;
            width: 100%;
            box-sizing: border-box;
        }
        .v-row { display: flex; justify-content: space-between; margin: 3px 0; }
        .v-line { border-top: 1.5px solid #333; margin: 6px 0; }
        .v-label { color: #555; font-weight: normal; }
        .v-val { font-weight: bold; text-align: right; }

        /* 直式下方結果欄位對齊樣式 */
        .result-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-top: 10px; 
            font-family: monospace; 
        }
        .result-label { font-weight: bold; }
        .result-val { text-align: right; font-weight: bold; }

        button { width: 100%; padding: 12px; margin-top: 15px; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; }
        .btn-save { background-color: #28a745; color: white; }
        .btn-nav { background-color: #007bff; color: white; }
        .btn-delete { background-color: #dc3545; color: white; }
        .btn-back { background-color: #6c757d; color: white; }
        .record-item { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        #historyView, #detailView { display: none; }
        .detail-input-group { margin-bottom: 12px; }
        .detail-input-group label { margin-top: 5px; font-size: 14px; color: #555; }
        .detail-result { background: #fff3cd; color: #856404; border-left: 3px solid #ffc107; }
        
        /* 僅百萬位數以上顯示紅色的樣式 */
        .million-num { color: #dc3545 !important; font-weight: bold; }
    </style>
</head>
<body>
<div id="calcView">
    <h2>流量運算器</h2>
    <div class="card">
        <label>站點資訊 (限10字)</label>
        <input type="text" id="stationName" maxlength="10" placeholder="例如：A站點">
        <label>RTU上的FC值 溫壓補償係數 (FC)</label>
        <input type="number" id="fc" value="1" step="0.0001" placeholder="請輸入此站FC">
        <label>RTU上的原CV值</label>
        <input type="number" id="origCV" step="0.001">
        <label>RTU上的原UV值</label>
        <input type="number" id="origUV" step="0.001">
        <label>機械錶度數</label>
        <input type="number" id="meterReading" step="0.001">
        <div class="result-box">
            <p style="margin:0 0 5px 0;">計算過程（直式）：</p>
            <div class="vertical-calc" id="resMissingProcess"></div>
            
            <div class="result-row" style="margin-top: 15px;">
                <span class="result-label">計算後的CV差值：</span>
                <span id="resMissingCV" class="result-val">0</span>
            </div>
            <div class="result-row">
                <span class="result-label">需輸入的CV新值：</span>
                <span id="resKeyInCV" class="result-val">0</span>
            </div>
        </div>
        <button class="btn-save" onclick="saveData()">儲存記錄</button>
        <button class="btn-nav" onclick="showHistory()">查看記錄</button>
    </div>
</div>
<div id="historyView">
    <h2>記錄列表</h2>
    <div class="card" id="historyList"></div>
    <button class="btn-back" onclick="showCalc()">返回計算</button>
</div>
<div id="detailView">
    <h2>記錄詳情與編輯</h2>
    <div class="card" id="detailContent"></div>
    <button class="btn-save" onclick="updateCurrentRecord()">儲存修改</button>
    <button class="btn-delete" onclick="deleteCurrent()">刪除此筆記錄</button>
    <button class="btn-back" onclick="showHistory()">返回列表</button>
</div>

<script>
    let records = [];
    try {
        records = JSON.parse(localStorage.getItem('flowRecords') || '[]');
    } catch (e) {
        records = [];
    }
    let currentDetailIdx = -1;

    // 格式化函式：僅百萬位數以上變紅，百萬以下維持原色
    function formatNumber(num, decimals = 3) {
        if (isNaN(num)) return '0';
        let formatted = Number(num).toLocaleString('zh-TW', {
            minimumFractionDigits: decimals,
            maximumFractionDigits: decimals
        });
        
        if (Math.abs(num) >= 1000000) {
            let parts = formatted.split(',');
            if (parts.length >= 3) {
                let millionPart = parts.slice(0, parts.length - 2).join(',') + ',';
                let restPart = parts.slice(parts.length - 2).join(',');
                return `<span class="million-num">${millionPart}</span>${restPart}`;
            }
        }
        return formatted;
    }

    // 產生直式 HTML 內容
    function generateVerticalHTML(meter, origUV, diff, fc, missing, origCV, keyin) {
        return `
            <div class="v-row"><span class="v-label">&nbsp;&nbsp;機械錶：</span><span class="v-val">${formatNumber(meter, 3)}</span></div>
            <div class="v-row"><span class="v-label">－原UV值：</span><span class="v-val">${formatNumber(origUV, 3)}</span></div>
            <div class="v-line"></div>
            <div class="v-row"><span class="v-label">&nbsp;&nbsp;度數差：</span><span class="v-val">${formatNumber(diff, 3)}</span></div>
            <div class="v-row"><span class="v-label">× FC係數：</span><span class="v-val">${fc}</span></div>
            <div class="v-line"></div>
            <div class="v-row"><span class="v-label">＝CV差值：</span><span class="v-val" style="color:#007bff;">${formatNumber(missing, 3)}</span></div>
            <div class="v-row"><span class="v-label">＋原CV值：</span><span class="v-val">${formatNumber(origCV, 3)}</span></div>
            <div class="v-line"></div>
            <div class="v-row"><span class="v-label">＝需輸入CV新值：</span><span class="v-val" style="color:#28a745;">${formatNumber(keyin, 3)}</span></div>
        `;
    }

    function calc() {
        const fcEl = document.getElementById('fc');
        const origCVEl = document.getElementById('origCV');
        const origUVEl = document.getElementById('origUV');
        const meterEl = document.getElementById('meterReading');
        if (!fcEl || !origCVEl || !origUVEl || !meterEl) return;

        const fcInput = fcEl.value;
        const fc = fcInput !== "" ? parseFloat(fcInput) : 1;
        const origCV = parseFloat(origCVEl.value) || 0;
        const origUV = parseFloat(origUVEl.value) || 0;
        const meter = parseFloat(meterEl.value) || 0;
        
        const diff = meter - origUV;
        const missing = diff * fc;
        const keyin = origCV + missing;

        document.getElementById('resMissingCV').innerHTML = formatNumber(missing, 3);
        document.getElementById('resKeyInCV').innerHTML = formatNumber(keyin, 3);
        
        // 渲染完整直式運算
        document.getElementById('resMissingProcess').innerHTML = generateVerticalHTML(meter, origUV, diff, fc, missing, origCV, keyin);
        
        return { missing, keyin, fc, origCV, origUV, meter };
    }

    const allInputs = document.getElementsByTagName('input');
    for (let i = 0; i < allInputs.length; i++) {
        allInputs[i].addEventListener('input', calc);
    }

    const stationNameEl = document.getElementById('stationName');
    if (stationNameEl) {
        stationNameEl.addEventListener('input', function() {
            const name = this.value.trim();
            const fcEl = document.getElementById('fc');
            if (name && fcEl) {
                try {
                    const configs = JSON.parse(localStorage.getItem('stationConfigs') || '{}');
                    if (configs[name] !== undefined) {
                        fcEl.value = configs[name];
                    } else {
                        fcEl.value = 1;
                    }
                } catch (e) {
                    fcEl.value = 1;
                }
                calc();
            }
        });
    }

    function saveData() {
        if (!confirm("確定要儲存這筆記錄嗎？")) return;
        const data = calc();
        const now = new Date();
        const stationName = document.getElementById('stationName').value.trim() || '未命名';
        const entry = {
            date: now.toLocaleString('zh-TW', { hour12: false }),
            station: stationName,
            ...data
        };
        records.unshift(entry);
        if (records.length > 100) records.pop();
        try {
            localStorage.setItem('flowRecords', JSON.stringify(records));
            if (stationName !== '未命名') {
                const configs = JSON.parse(localStorage.getItem('stationConfigs') || '{}');
                configs[stationName] = data.fc;
                localStorage.setItem('stationConfigs', JSON.stringify(configs));
            }
        } catch (e) {
            alert("儲存至手機空間失敗。");
        }
        alert("儲存成功！");
    }

    function showHistory() {
        document.getElementById('calcView').style.display = 'none';
        document.getElementById('detailView').style.display = 'none';
        document.getElementById('historyView').style.display = 'block';
        const list = document.getElementById('historyList');
        list.innerHTML = records.length ? '' : '<p>無記錄</p>';
        records.forEach((r, idx) => {
            const div = document.createElement('div');
            div.className = 'record-item';
            div.innerHTML = `
                <div>
                    <div style="font-size: 13px; color: #666;">${r.date}</div>
                    <div style="font-weight: bold; font-size: 15px; margin-top: 3px; color: #2c3e50;">${r.station}</div>
                </div>
                <button onclick="showDetail(${idx})" style="width: auto; padding: 6px 12px; margin: 0; background-color: #007bff; color: white;">編輯/查看</button>
            `;
            list.appendChild(div);
        });
    }

    function showDetail(idx) {
        currentDetailIdx = idx;
        const r = records[idx];
        document.getElementById('historyView').style.display = 'none';
        document.getElementById('detailView').style.display = 'block';
        document.getElementById('detailContent').innerHTML = `
            <p style="font-size: 14px; color:#666;"><b>記錄時間:</b> ${r.date}</p>
            <div class="detail-input-group"><label>站點資訊</label><input type="text" id="editStation" value="${r.station}" maxlength="10"></div>
            <div class="detail-input-group"><label>FC 係數</label><input type="number" id="editFC" value="${r.fc}" step="0.0001"></div>
            <div class="detail-input-group"><label>RTU上的原CV值</label><input type="number" id="editOrigCV" value="${r.origCV}" step="0.001"></div>
            <div class="detail-input-group"><label>RTU上的原UV值</label><input type="number" id="editOrigUV" value="${r.origUV}" step="0.001"></div>
            <div class="detail-input-group"><label>機械錶度數</label><input type="number" id="editMeter" value="${r.meter}" step="0.001"></div>
            <div class="result-box detail-result">
                <p style="margin:0 0 5px 0;">計算過程（直式）：</p>
                <div class="vertical-calc" id="editResProcess"></div>
                <div class="result-row" style="margin-top: 15px;">
                    <span class="result-label">計算後的CV差值：</span>
                    <span id="editResMissing" class="result-val">0</span>
                </div>
                <div class="result-row">
                    <span class="result-label">需輸入的CV新值：</span>
                    <span id="editResKeyIn" class="result-val">0</span>
                </div>
            </div>
        `;
        const ids = ['editStation', 'editFC', 'editOrigCV', 'editOrigUV', 'editMeter'];
        ids.forEach(id => {
            const el = document.getElementById(id);
            if (el) el.addEventListener('input', calcDetail);
        });
        calcDetail();
    }

    function calcDetail() {
        const fcInput = document.getElementById('editFC').value;
        const fc = fcInput !== "" ? parseFloat(fcInput) : 1;
        const origCV = parseFloat(document.getElementById('editOrigCV').value) || 0;
        const origUV = parseFloat(document.getElementById('editOrigUV').value) || 0;
        const meter = parseFloat(document.getElementById('editMeter').value) || 0;
        
        const diff = meter - origUV;
        const missing = diff * fc;
        const keyin = origCV + missing;

        document.getElementById('editResMissing').innerHTML = formatNumber(missing, 3);
        document.getElementById('editResKeyIn').innerHTML = formatNumber(keyin, 3);
        document.getElementById('editResProcess').innerHTML = generateVerticalHTML(meter, origUV, diff, fc, missing, origCV, keyin);
    }

    function updateCurrentRecord() {
        if (!confirm("確定要儲存此次修改嗎？")) return;
        const fcInput = document.getElementById('editFC').value;
        const fc = fcInput !== "" ? parseFloat(fcInput) : 1;
        const origCV = parseFloat(document.getElementById('editOrigCV').value) || 0;
        const origUV = parseFloat(document.getElementById('editOrigUV').value) || 0;
        const meter = parseFloat(document.getElementById('editMeter').value) || 0;
        const station = document.getElementById('editStation').value.trim() || '未命名';
        const missing = (meter - origUV) * fc;
        const keyin = origCV + missing;

        records[currentDetailIdx].station = station;
        records[currentDetailIdx].fc = fc;
        records[currentDetailIdx].origCV = origCV;
        records[currentDetailIdx].origUV = origUV;
        records[currentDetailIdx].meter = meter;
        records[currentDetailIdx].missing = missing;
        records[currentDetailIdx].keyin = keyin;

        try {
            localStorage.setItem('flowRecords', JSON.stringify(records));
            if (station !== '未命名') {
                const configs = JSON.parse(localStorage.getItem('stationConfigs') || '{}');
                configs[station] = fc;
                localStorage.setItem('stationConfigs', JSON.stringify(configs));
            }
        } catch (e) {
            alert("儲存失敗。");
        }
        alert("修改已儲存！");
        showHistory();
    }

    function deleteCurrent() {
        if (!confirm("確定要刪除這筆記錄嗎？")) return;
        records.splice(currentDetailIdx, 1);
        try {
            localStorage.setItem('flowRecords', JSON.stringify(records));
        } catch (e) {}
        showHistory();
    }

    function showCalc() {
        document.getElementById('calcView').style.display = 'block';
        document.getElementById('historyView').style.display = 'none';
        document.getElementById('detailView').style.display = 'none';
        calc();
    }

    calc();
</script>
</body>
</html>
